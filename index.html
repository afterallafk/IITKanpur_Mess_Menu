<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hall 14 Mess Menu</title>
<meta name="description" content="Mess menu for Hall 14, IIT Kanpur.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E13">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IITK Mess">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

<!-- version.js must load before styles/scripts that reference APP_VERSION -->
<script src="version.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Splash screen: shown briefly on first load only -->
<div id="splash" aria-hidden="true">
  <div class="splash-logo-plate">
    <img src="icons/IIT_Kanpur_Logo.png" alt="" width="92" height="92">
  </div>
  <div class="splash-text">
    <p class="splash-title">IITK Mess Menu</p>
    <p class="splash-sub">Hall 14 · Indian Institute of Technology Kanpur</p>
  </div>
</div>

<div class="wrap">

  <header class="site-header">
    <div class="brand-row">
      <div class="brand-crest">
        <img src="icons/IIT_Kanpur_Logo.png" alt="IIT Kanpur crest" width="26" height="26">
      </div>
      <div>
        <h1 class="wordmark">Hall<span>14</span></h1>
        <div class="header-sub">Mess menu · IIT Kanpur</div>
      </div>
    </div>
    <div class="header-meta" id="headerDate">—</div>
  </header>

  <section class="hero" id="heroWrap">
    <div class="hero-inner" id="hero"><!-- filled by app.js --></div>
  </section>

  <nav class="day-row" id="dayRow" aria-label="Choose a day"></nav>

  <main class="meal-grid" id="mealGrid" aria-label="Meals for the selected day"><!-- filled by app.js --></main>

  <section class="staples" id="staples"><!-- filled by app.js --></section>

  <div class="footer-row">
    <button class="install-btn" id="installBtn" type="button">
      Install Hall 14 Mess on this device
    </button>
    <div class="price-legend" id="priceLegend"><!-- filled by app.js --></div>
    <p class="credit">Menu as posted for October 2026. Check the mess notice board for last-minute changes.</p>
    <span class="app-version" id="appVersion"></span>
  </div>

</div>

<div class="update-toast" id="updateToast">
  <span>A new version is available</span>
  <button id="updateReloadBtn" type="button">Refresh</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
